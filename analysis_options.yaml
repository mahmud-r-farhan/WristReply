# Analyzer configuration for the WristReply AI Flutter presentation layer.
#
# Baseline: `package:flutter_lints` (the rule set every new Flutter project
# ships with) plus a handful of extra rules that the code base already
# satisfies and that we want to keep enforcing in review.
#
# Deliberately NOT enabled (they fought the code base instead of protecting it):
#   * public_member_api_docs / package_api_docs — this is an *application*, not
#     a published package; documenting every colour constant adds noise.
#   * comment_references — flags prose such as "the Kotlin FallbackReplyEngine"
#     that is intentionally not a Dart symbol.
#   * require_trailing_commas / always_declare_return_types — pure formatting
#     churn; `dart format` is the tool for that, not CI.
#
# Compatible with flutter_lints ^5.x (Dart SDK 3.10+ / Flutter 3.47+).

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # A dangling import is always a mistake — fail the build, don't warn.
    unused_import: error
    unused_local_variable: warning
    dead_code: warning
    avoid_print: warning
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**

linter:
  rules:
    # Style --------------------------------------------------------
    prefer_single_quotes: true
    avoid_relative_lib_imports: true
    directives_ordering: true
    omit_local_variable_types: true
    prefer_final_locals: true
    unnecessary_parenthesis: true

    # Correctness --------------------------------------------------
    avoid_dynamic_calls: true
    await_only_futures: true
    cancel_subscriptions: true
    close_sinks: true
    hash_and_equals: true
    no_duplicate_case_values: true
    throw_in_finally: true
    unnecessary_statements: true
    use_full_hex_values_for_flutter_colors: true
