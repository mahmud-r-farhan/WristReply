name: wrist_reply
description: >
  WristReply AI — Offline-first, on-device smart reply engine and wearable
  companion for Android. Delivers context-aware, low-latency quick-reply
  pills directly onto notifications and mirrors them to Wear OS, Zepp OS,
  and budget RTOS smartwatches.
publish_to: 'none'
version: 0.2.0+2

# The pinned toolchain (see .github/workflows/*) is Flutter 3.38 / Dart 3.10,
# which is also what pubspec.lock was resolved with. Keep these in sync.
environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/onboarding/
