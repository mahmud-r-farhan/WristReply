name: wrist_reply
description: >
  WristReply AI — Offline-first, on-device smart reply engine and wearable
  companion for Android. Delivers context-aware, low-latency quick-reply
  pills directly onto notifications and mirrors them to Wear OS, Zepp OS,
  and budget RTOS smartwatches.
publish_to: 'none'
version: 0.2.0+2

# CI pins Flutter 3.47.6, the stable release that ships Dart 3.10 (Flutter 3.38
# ships Dart 3.10.0-290.4.beta, a pre-release that does not satisfy ^3.10.0).
# pubspec.lock was resolved against dart >=3.10.0 / flutter >=3.38.0; keep the
# two in sync.
environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/onboarding/
