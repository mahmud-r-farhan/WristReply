name: Docs

# Lints every Markdown file in the repository using .markdownlint-cli2.jsonc
# (which inherits the rule set from .markdownlint.json).
on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.markdownlint.json'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.md'
      - '.markdownlint.json'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md" "#**/node_modules/**" "#**/build/**"
