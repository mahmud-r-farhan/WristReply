name: CI

on:
  push:
    branches: [main, arena/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------
  # Dart / Flutter: analyze + test
  # ----------------------------------------------------------------------
  flutter-test:
    name: Flutter (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [analyze, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Show Flutter / Java versions
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze (${{ matrix.target }})
        if: matrix.target == 'analyze'
        run: flutter analyze

      - name: Test (${{ matrix.target }})
        if: matrix.target == 'test'
        run: flutter test --coverage --reporter=expanded

      - name: Upload coverage report
        if: matrix.target == 'test' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info

  # ----------------------------------------------------------------------
  # Kotlin: JUnit tests for the core engine
  # ----------------------------------------------------------------------
  core-engine-test:
    name: Core-Engine (JUnit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew || true

      - name: Run :core-engine unit tests
        working-directory: android
        run: ./gradlew :core-engine:testDebugUnitTest --stacktrace

      - name: Build core-engine AAR
        working-directory: android
        run: ./gradlew :core-engine:assembleRelease --stacktrace

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-engine-aar
          path: android/core-engine/build/outputs/aar/

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-engine-junit
          path: android/core-engine/build/reports/tests/

  # ----------------------------------------------------------------------
  # Markdown linting
  # ----------------------------------------------------------------------
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !node_modules/**
            !build/**
            !playground/build/**