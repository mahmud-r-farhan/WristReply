name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.2.0). Leave blank to derive from package metadata.'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  # ----------------------------------------------------------------------
  # Determine the tag for this release run
  # ----------------------------------------------------------------------
  resolve-tag:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tagger.outputs.tag }}
      version: ${{ steps.tagger.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide tag
        id: tagger
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "version=${${{ github.event.inputs.tag }}#v}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.ref_type }}" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.0.0-ci" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0-ci" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved tag=$(cat "$GITHUB_OUTPUT" | head -1)"

  build-aar:
    name: Build core-engine AAR
    needs: resolve-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-release-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}

      - name: Build AAR
        working-directory: android
        run: ./gradlew :core-engine:assembleRelease --stacktrace

      - name: Publish AAR to local Maven layout
        working-directory: android
        run: ./gradlew :core-engine:publishReleasePublicationToMavenLocal --stacktrace

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: wristreply-core-aar-${{ needs.resolve-tag.outputs.version }}
          path: android/core-engine/build/outputs/aar/

  build-android:
    name: Build Android App Bundle
    needs: resolve-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate signed debug APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace
        continue-on-error: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wristreply-android-debug-${{ needs.resolve-tag.outputs.version }}
          path: android/app/build/outputs/apk/release/

  publish-github-release:
    name: Publish GitHub Release
    needs: [resolve-tag, build-aar, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AAR artifact
        uses: actions/download-artifact@v4
        with:
          name: wristreply-core-aar-${{ needs.resolve-tag.outputs.version }}
          path: artifacts/aar/

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: wristreply-android-debug-${{ needs.resolve-tag.outputs.version }}
          path: artifacts/apk/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: WristReply AI ${{ needs.resolve-tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.resolve-tag.outputs.version, 'rc') || contains(needs.resolve-tag.outputs.version, 'beta') }}
          generate_release_notes: true
          files: |
            artifacts/aar/*.aar
            artifacts/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}