name: Release

# Cuts a GitHub Release with the standalone core-engine AAR plus the Android
# app bundle. Triggered by pushing a v*.*.* tag, or manually.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.2.0). Leave blank to derive from package metadata.'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

env:
  FLUTTER_VERSION: '3.38.0'
  JAVA_VERSION: '17'

jobs:
  resolve-tag:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tagger.outputs.tag }}
      version: ${{ steps.tagger.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Decide tag
        id: tagger
        run: |
          set -euo pipefail
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.0.0-ci"
          fi
          # Strip a single leading "v" -> 0.2.0
          VERSION="${TAG#v}"
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} version=${VERSION}"

  build-aar:
    name: Build core-engine AAR
    needs: resolve-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}

      - name: Point Gradle at the Flutter SDK
        working-directory: android
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > local.properties
          chmod +x gradlew

      - name: Build AAR
        working-directory: android
        run: ./gradlew :core-engine:assembleRelease --stacktrace

      - name: Upload AAR
        uses: actions/upload-artifact@v7
        with:
          name: wristreply-core-aar-${{ needs.resolve-tag.outputs.version }}
          path: build/core-engine/outputs/aar/

  build-android:
    name: Build Android app
    needs: resolve-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build app bundle
        run: flutter build appbundle

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: wristreply-android-bundle-${{ needs.resolve-tag.outputs.version }}
          path: build/app/outputs/bundle/release/*.aab

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: wristreply-android-apk-${{ needs.resolve-tag.outputs.version }}
          path: build/app/outputs/flutter-apk/*.apk

  publish-github-release:
    name: Publish GitHub Release
    needs: [resolve-tag, build-aar, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download AAR
        uses: actions/download-artifact@v7
        with:
          name: wristreply-core-aar-${{ needs.resolve-tag.outputs.version }}
          path: artifacts/aar/

      - name: Download app bundle
        uses: actions/download-artifact@v7
        with:
          name: wristreply-android-bundle-${{ needs.resolve-tag.outputs.version }}
          path: artifacts/aab/

      - name: Download APKs
        uses: actions/download-artifact@v7
        with:
          name: wristreply-android-apk-${{ needs.resolve-tag.outputs.version }}
          path: artifacts/apk/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: WristReply AI ${{ needs.resolve-tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.resolve-tag.outputs.version, 'rc') || contains(needs.resolve-tag.outputs.version, 'beta') }}
          generate_release_notes: true
          files: |
            artifacts/aar/*.aar
            artifacts/aab/*.aab
            artifacts/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
