name: Flutter

# Verifies the Dart/Flutter presentation layer (lib/) and the static playground.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Kept in sync with pubspec.yaml (environment) and pubspec.lock (sdks).
  FLUTTER_VERSION: '3.47.6'
  JAVA_VERSION: '17'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version
          java -version
          echo "::notice title=toolchain::$(flutter --version 2>&1 | tr '\n' ' ' | cut -c1-400)"

      - name: Install dependencies
        run: flutter pub get

      - name: Verify pubspec.lock is in sync with pubspec.yaml
        run: |
          if git diff --quiet pubspec.lock; then
            echo "pubspec.lock is in sync with the pinned toolchain."
            exit 0
          fi
          echo "pubspec.lock drifted; run `flutter pub get` with Flutter $FLUTTER_VERSION and commit the result."
          git --no-pager diff pubspec.lock
          exit 1

      - name: Analyze
        run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run widget + unit tests
        run: flutter test --coverage --reporter=expanded

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: warn

