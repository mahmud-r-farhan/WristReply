<!DOCTYPE html>
<html lang="en">
<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description"
          content="WristReply AI — Offline-first smart reply engine. Try the live playground in your browser." />
    <meta name="theme-color" content="#0B0E14" />

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="WristReply" />

    <link rel="manifest" href="manifest.json" />

    <title>WristReply AI Playground</title>
    <style>
        html, body {
            background-color: #0B0E14;
            margin: 0;
            padding: 0;
            height: 100%;
        }
        #loading {
            align-items: center;
            color: #94A3B8;
            display: flex;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            justify-content: center;
            flex-direction: column;
        }
        #loading .spinner {
            border: 2px solid #222B3D;
            border-top-color: #38EF7D;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        #loading .label {
            color: #475569;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div class="label">Booting WristReply Playground…</div>
    </div>

    <script>
        // Show the spinner until Flutter Engine mounts.
        window.addEventListener('flutter-first-frame', function () {
            var el = document.getElementById('loading');
            if (el) el.remove();
        });
    </script>

    <script src="flutter_bootstrap.js" async></script>
</body>
</html>
